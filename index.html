<title>Rent Link Market</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: white header with marigold rule; landlord tabs (Rent Desk / Months / Invoices / Settings), tenant account, public receipt check; ledgers, month strip, invoice overlay */
:root{
  --paper:#ffffff; --card:#ffffff; --soft:#f6f7f6; --ink:#000000; --muted:#333333;
  --line:#e2e6e3; --marigold:#e39a12; --marigold-ink:#2a1a00; --tint:#f3f3f3;
  --ok:#000000; --ok-soft:#f1f1f1; --warn:#d0021b; --warn-soft:#fdeaea; --danger:#d0021b; --danger-soft:#fdeaea;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 3px 0 var(--marigold)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand b{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand b span{color:var(--marigold)}
.brand small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{background:transparent;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px}
nav.tabs button:hover{background:var(--tint)}
nav.tabs button[aria-current="page"]{background:var(--marigold);color:var(--marigold-ink)}
main{padding-block:24px 64px}
h1,h2,h3{text-wrap:balance;margin:0}
.display{font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.h1{font-size:clamp(36px,6vw,54px)} .h2{font-size:26px} .h3{font-size:20px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .hint{font-size:12px;color:var(--muted);font-weight:400}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:var(--r);padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;min-height:42px}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--ink);color:#fff} .btn.primary:hover{opacity:.9}
.btn.gold{background:var(--marigold);border-color:var(--marigold);color:var(--marigold-ink)}
.btn.danger{border-color:var(--danger);color:var(--danger)} .btn.danger.solid{background:var(--danger);color:#fff}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px;border-width:1.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.stack{display:grid;gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px;align-items:start}
@media (max-width:880px){.two{grid-template-columns:1fr}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
label.fld{display:grid;gap:4px;font-size:13px;font-weight:600}
label.fld input,label.fld select,label.fld textarea{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font-weight:400;font-size:15px;width:100%;min-width:0}
label.fld textarea{min-height:70px;resize:vertical}
label.fld input:focus,label.fld select:focus,label.fld textarea:focus{border-color:var(--ink);outline:none}
fieldset{border:1px dashed var(--line);border-radius:8px;padding:12px;margin:0;display:grid;gap:12px}
legend{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 6px}
.msg{padding:10px 14px;border-radius:8px;font-size:14px}
.msg.err{background:var(--danger-soft);color:var(--danger)} .msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.info{background:var(--tint)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)} .pill.off{background:var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0;display:grid;gap:2px}
.stat b{display:block;font-family:var(--f-mono);font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span{font-size:13px;color:var(--muted)}
.stat.alert{border-color:var(--danger)} .stat.alert b{color:var(--danger)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
table.wide{min-width:820px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;background:var(--soft)}
td.num,th.num{text-align:right}
tfoot th{color:#000;font-size:12px}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--tint)}
.months{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.mon{border-radius:8px;padding:8px 6px;text-align:center;border:1.5px solid var(--line);background:var(--card);display:grid;gap:2px}
.mon b{font-size:12px;font-weight:700}
.mon span{font-size:11px}
.mon.ok{border-color:#000}
.mon.part,.mon.due{background:var(--danger-soft);border-color:transparent;color:var(--danger)}
.mon.cur{outline:2px solid var(--ink);outline-offset:1px}
.slip{border:2px dashed var(--marigold);border-radius:var(--r);padding:16px;display:grid;gap:10px;background:#fffaf0}
.creds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cred{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;justify-items:start}
.cred b{font-family:var(--f-mono);font-size:26px;letter-spacing:.08em}
.big-due{display:grid;gap:4px;padding:18px 20px;border-radius:var(--r);background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
.big-due .amt{font-family:var(--f-mono);font-weight:700;font-size:clamp(32px,7vw,48px);line-height:1.1}
.big-due .eyebrow{color:var(--danger)}
.big-due.clear{background:#fff;color:#000;border-color:#000} .big-due.clear .eyebrow{color:#000}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:32px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty h3{font-family:var(--f-display);font-size:26px;text-transform:uppercase}
.inline-confirm{background:var(--danger-soft);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--danger)}
.mlist tr.sel td{background:var(--soft);font-weight:700}
.method-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) auto auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:620px){.method-row{grid-template-columns:1fr 1fr}}
.paybox{border:1.5px solid #000;border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.paybox .pm div{white-space:pre-wrap;font-family:var(--f-mono);font-size:13px}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.proof-thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;background:var(--soft)}
.approve-box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
@media (max-width:620px){.approve-box{grid-template-columns:1fr}}
.claim-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.claim-card:last-child{border-bottom:0}
.newrcpt{border:2px solid #000;border-radius:var(--r);padding:12px 16px;display:grid;gap:8px;background:#fff}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.verify-result{border:2px solid #000;border-radius:var(--r);padding:16px;display:grid;gap:8px}
.verify-result.bad{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}
.verify-result .big{font-family:var(--f-display);font-size:30px;font-weight:900;text-transform:uppercase;line-height:1}
.overlay{position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.45);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.inv-actions{max-width:780px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.inv-actions .btn{background:#fff} .inv-actions .btn.primary{background:#000;color:#fff}
.invoice{max-width:780px;margin:0 auto;background:#fff;color:#000;border-radius:6px;padding:clamp(20px,5vw,44px);display:grid;gap:22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.inv-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;border-bottom:3px solid #000;padding-bottom:16px}
.inv-head .mk{font-family:var(--f-display);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.inv-head .doc{text-align:right;display:grid;gap:2px}
.inv-head .doc b{font-family:var(--f-display);font-size:34px;font-weight:900;letter-spacing:.06em;line-height:1}
.inv-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;font-size:14px}
.inv-meta div{display:grid;gap:2px}
.inv-lines{width:100%;border-collapse:collapse;font-size:14px}
.inv-lines th{background:#000;color:#fff}
.inv-lines td,.inv-lines th{padding:10px 12px;border-bottom:1px solid #ddd}
.inv-lines .amt{text-align:right}
.inv-total{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:3px solid #000;padding-top:14px}
.inv-total .amt{font-family:var(--f-mono);font-weight:700;font-size:28px}
.stamp{border:3px solid #000;font-family:var(--f-display);font-weight:900;font-size:24px;letter-spacing:.12em;padding:4px 14px;transform:rotate(-4deg);display:inline-block}
.stamp.unpaid{border-color:var(--danger);color:var(--danger)}
.inv-verify{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;border:2px dashed #000;border-radius:6px;padding:10px 14px}
.inv-verify .code{font-size:20px}
.inv-foot{font-size:12px;color:#333;display:grid;gap:6px;border-top:1px solid #ddd;padding-top:12px}
.proof-view{max-width:780px;margin:0 auto;background:#fff;border-radius:6px;padding:12px;display:grid;gap:8px;justify-items:center}
.proof-view img{max-width:100%;max-height:75vh;border-radius:4px}
.foot{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.foot .wrap{padding-block:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#000;color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.back{background:none;border:0;cursor:pointer;font-weight:600;padding:0;margin-bottom:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:#000;color:#fff;border-color:#000}
@media (prefers-reduced-motion:no-preference){.btn,.chip{transition:background .15s,border-color .15s}}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><b>Rent <span>Link</span> Market</b><small id="mkt">Shop rent management</small></div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<div class="overlay" id="overlay" hidden></div>
<footer class="foot"><div class="wrap row between"><span>Rent Link Market · Shop rent, invoices, receipts and accounts</span><span id="foot-date"></span></div></footer>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(() => {
const BRAND = "Rent Link Market";
const OLD_BRANDS = ["رینٹ لنک مارکیٹ"];
const DEFAULT_SETTINGS = {marketName:BRAND, landlord:"", landlordPhone:"", dueDay:5,
  methods:[{name:"Cash",details:"Pay at the market office",on:true},{name:"Bank transfer",details:"",on:true},{name:"JazzCash",details:"",on:true},{name:"Easypaisa",details:"",on:true},{name:"Cheque",details:"",on:false}]};
const FLOORS = ["Ground floor","Basement","1st floor","2nd floor","3rd floor"];
const REASONS = ["Monthly rent","Electricity bill","Water / gas bill","Repair / maintenance","Security deposit","Fine","Other"];
const RENT = REASONS[0];
const RENT_ALIASES = [RENT, "ماہانہ کرایہ"];
const SESSION_KEY = "rlm-tenant";
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const S = {
  db:null, isOwner:false, ready:false, dbMissing:false, downloads:null,
  units:[], pins:{}, counter:0, salt:"", view:"login", settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), draft:null, selMonth:null,
  openUnit:null, filter:"all", invoice:null, proofView:null, proofCache:{},
  session:null, myUnit:null, myUnsub:null, verify:null,
  confirm:null, lastCreated:null, editing:false, msg:null, busy:false
};
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => Math.round(Number(n)||0).toLocaleString("en-PK");
const rs = n => `<span class="mono">Rs ${num(n)}</span>`;
const rsT = n => `Rs ${num(n)}`;
const store = { get(k){ try { return sessionStorage.getItem(k); } catch { return null; } }, set(k,v){ try { v==null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v); } catch {} } };
function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(()=> el.hidden = true, 2600); }
function setMsg(t,m){ S.msg = {t,m}; }
const methodNames = () => { const m = (S.settings.methods||[]).filter(x => x.on !== false && x.name).map(x => x.name); return m.length ? m : ["Cash"]; };
const mkName = () => { const n = S.settings.marketName; return !n || OLD_BRANDS.includes(n) ? BRAND : n; };
const isRentReason = p => !p.reason || RENT_ALIASES.includes(p.reason);
const reasonOf = p => isRentReason(p) ? RENT : p.reason;
const credit = p => { if (p.status === "pending" || p.status === "rejected") return 0;
  if (p.rentCredit != null) return Number(p.rentCredit)||0;
  return isRentReason(p) ? Math.max(0, (Number(p.amount)||0) - (Number(p.deductAmt)||0)) : 0; };

/* ---------- dates ---------- */
const today = () => new Date();
const pad = n => String(n).padStart(2,"0");
const todayISO = () => { const d = today(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const curMonth = () => { const d = today(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monLabel = k => { const [y,m] = k.split("-"); return `${MON[+m-1]} ${y}`; };
const fmtD = iso => { if (!iso) return "—"; const d = new Date(iso.length===10 ? iso+"T00:00:00" : iso); return isNaN(d) ? iso : `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const fmtWhen = p => { const t = p.at || p.date; if (!t) return "—"; const d = new Date(p.at ? t : t+"T00:00:00"); if (isNaN(d)) return String(t);
  let s = `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
  if (p.at){ const h = d.getHours(); s += `, ${h % 12 || 12}:${pad(d.getMinutes())} ${h < 12 ? "AM" : "PM"}`; }
  return s; };
const sortKey = p => p.at || p.date || "";
function monthsFrom(startISO, endISO){
  if (!startISO) return [];
  let [y,m] = startISO.split("-").map(Number); const end = endISO ? endISO.slice(0,7) : curMonth(); const out = [];
  while (out.length < 240){ const k = `${y}-${pad(m)}`; if (k > end) break; out.push(k); m++; if (m>12){m=1;y++;} }
  return out;
}

/* ---------- rent maths ---------- */
function calc(u){
  if (!u || (u.status !== "occupied" && u.status !== "left") || !u.startDate) return null;
  const rent = Number(u.rent)||0;
  const months = monthsFrom(u.startDate, u.status === "left" ? u.endDate : "");
  const confirmed = (u.payments||[]).filter(p => p.status !== "pending" && p.status !== "rejected");
  const byMonth = {}; confirmed.forEach(p => byMonth[p.month] = (byMonth[p.month]||0) + credit(p));
  const paid = confirmed.reduce((s,p)=>s+credit(p),0);
  const other = confirmed.reduce((s,p)=>s+(Number(p.amount)||0)-credit(p),0);
  const received = confirmed.reduce((s,p)=>s+(Number(p.amount)||0),0);
  const expected = rent * months.length;
  const balance = Math.max(0, expected - paid), advance = Math.max(0, paid - expected);
  const cm = curMonth(), curPaid = byMonth[cm]||0, dueDay = Number(u.dueDay)||5;
  let cur;
  if (u.status === "left") cur = {k:"off", t:"Left"};
  else if (!months.includes(cm)) cur = {k:"off", t:"Not started"};
  else if (curPaid >= rent) cur = {k:"ok", t:"Paid"};
  else if (curPaid > 0) cur = {k:"warn", t:"Part paid"};
  else if (today().getDate() > dueDay) cur = {k:"bad", t:"Late"};
  else cur = {k:"warn", t:`Due by ${dueDay}th`};
  const unpaidMonths = months.filter(k => (byMonth[k]||0) < rent && (k < cm || today().getDate() > dueDay)).length;
  const paidMonths = months.filter(k => (byMonth[k]||0) >= rent).length;
  return {rent, months, byMonth, paid, expected, balance, advance, cur, curPaid, unpaidMonths, paidMonths, other, received};
}
const isLate = (u,k) => k < curMonth() || today().getDate() > (Number(u.dueDay)||5);
function monthStrip(u, c){
  return `<div class="months">${c.months.slice(-12).map(k => { const p = c.byMonth[k]||0;
    const cls = p >= c.rent ? "ok" : p > 0 ? "part" : isLate(u,k) ? "due" : "";
    return `<div class="mon ${cls} ${k===curMonth()?"cur":""}" title="${monLabel(k)}"><b>${monLabel(k)}</b><span>${p>=c.rent?"Paid":p>0?"Part":isLate(u,k)?"Unpaid":"—"}</span></div>`; }).join("")}</div>`;
}
function fullHistory(u, c){
  const pays = (u.payments||[]).filter(p => p.status !== "rejected");
  const rows = [...c.months].reverse().map(k => {
    const ps = pays.filter(p => p.month === k).sort((a,b)=>sortKey(a).localeCompare(sortKey(b)));
    const got = c.byMonth[k]||0, left = Math.max(0, c.rent - got), late = isLate(u,k);
    const st = got >= c.rent ? ["ok","Paid"] : got > 0 ? ["warn","Part paid"] : late ? ["bad","Unpaid"] : ["warn","Not due yet"];
    return `<tr style="${left&&late?"color:var(--danger)":""}"><td><strong>${monLabel(k)}</strong></td><td class="num">${rs(c.rent)}</td><td class="num">${got?rs(got):"—"}</td>
      <td class="num" style="${left&&late?"font-weight:700":""}">${left?rs(left):"—"}</td>

/* ---------- receipt numbers & verification codes ---------- */
async function sha256hex(s){
  if (window.crypto?.subtle){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
  let h1 = 0x811c9dc5, h2 = 0x01000193; for (const ch of s){ h1 = Math.imul(h1 ^ ch.charCodeAt(0), 16777619)>>>0; h2 = Math.imul(h2 ^ ch.charCodeAt(0), 2246822519)>>>0; }
  return h1.toString(16).padStart(8,"0") + h2.toString(16).padStart(8,"0");
}
const normCode = s => String(s||"").toUpperCase().replace(/[^0-9A-F]/g,"");
const fmtCode = s => { const n = normCode(s); return n ? n.slice(0,4) + "-" + n.slice(4,8) : ""; };
const normNo = s => String(s||"").toUpperCase().replace(/\s+/g,"");
async function ensureSecrets(){
  if (S.salt) return;
  const sec = await S.db.doc("admin/secret").get();
  if (sec.exists && sec.data().salt) S.salt = sec.data().salt;
  else { const a = new Uint8Array(16); crypto.getRandomValues(a); S.salt = [...a].map(x=>x.toString(16).padStart(2,"0")).join(""); await write(()=>S.db.doc("admin/secret").set({salt:S.salt})); }
  const ct = await S.db.doc("admin/counter").get(); S.counter = ct.exists ? Number(ct.data().n)||0 : 0;
}
// Owner only: allocate the next receipt number and its verification code, and register it.
async function issueReceipt(u, p){
  await ensureSecrets();
  const year = new Date(p.at || Date.now()).getFullYear();
  const seq = S.counter + 1;
  const no = `RCT-${year}-${String(seq).padStart(6,"0")}`;
  const code = fmtCode((await sha256hex(`${S.salt}|${no}|${u.id}|${p.id}|${p.amount}|${p.at}`)).slice(0,8));
  await write(()=>S.db.doc("admin/counter").set({n:seq}));
  S.counter = seq;
  await write(()=>S.db.doc("receipts/"+no).set({code, shopCode:u.id, shopNo:u.shopNo, tenant:u.tenant, amount:Number(p.amount)||0, rentCredit:credit({...p, status:"confirmed"}), reason:reasonOf(p), month:p.month, paidAt:p.at||"", approvedAt:p.confirmedAt||new Date().toISOString(), pid:p.id, status:"valid"}));
  return {rcptNo:no, rcptCode:code};
}
let migrating = false;
async function migrateReceipts(){
  if (migrating || !S.isOwner || !S.db) return;
  const todo = S.units.flatMap(u => (u.payments||[]).filter(p => (p.status==="confirmed" || !p.status) && !p.rcptNo).map(p => ({u, p})));
  if (!todo.length) return;
  migrating = true;
  try {
    const byUnit = {};
    todo.sort((a,b)=>sortKey(a.p).localeCompare(sortKey(b.p)));
    for (const {u,p} of todo){ const r = await issueReceipt(u, p); (byUnit[u.id] ||= {})[p.id] = r; }
    for (const id of Object.keys(byUnit)){
      const snap = await S.db.doc("units/"+id).get(); if (!snap.exists) continue;
      const pays = (snap.data().payments||[]).map(p => byUnit[id][p.id] ? {...p, ...byUnit[id][p.id]} : p);
      await write(()=>S.db.doc("units/"+id).update({payments:pays}));
    }
  } catch {}
  migrating = false;
}
async function voidReceipt(no){ if (!no) return; try { const r = await S.db.doc("receipts/"+no).get(); if (r.exists) await write(()=>S.db.doc("receipts/"+no).update({status:"cancelled", cancelledAt:new Date().toISOString()})); } catch {} }

function findUnit(id){ return S.units.find(x=>x.id===id) || (S.myUnit && S.myUnit.id===id ? S.myUnit : null); }
function invoiceData(u, k){
  const c = calc(u); if (!c || !c.months.includes(k)) return null;
  const idx = c.months.indexOf(k);
  const paidBefore = (u.payments||[]).filter(p => p.status!=="pending" && p.status!=="rejected" && p.month < k).reduce((s,p)=>s+credit(p),0);
  const before = c.rent*idx - paidBefore, thisPaid = c.byMonth[k]||0;
  const lines = [[`Monthly rent — ${monLabel(k)}`, c.rent]];
  if (before > 0) lines.push(["Previous balance", before]);
  if (before < 0) lines.push(["Previous advance", before]);
  const gross = c.rent + before, total = gross - thisPaid;
  return {type:"INV", no:`INV-${u.id}-${k.replace("-","")}`, issued:`${k}-01`, due:`${k}-${pad(Number(u.dueDay)||5)}`, month:k,
    u, lines, gross, paid:thisPaid, total:Math.max(0,total), credit: total<0 ? -total : 0, isPaid: total <= 0,
    pays:(u.payments||[]).filter(p=>p.month===k && credit(p) > 0)};
}
function receiptData(u, pid){
  const p = (u.payments||[]).find(x=>x.id===pid); if (!p) return null; const c = calc(u);
  const amt = Number(p.amount)||0, cr = p.status==="confirmed" || !p.status ? credit(p) : (isRentReason(p) ? amt : 0);
  const lines = [[`Amount received — ${reasonOf(p)}`, amt]];
  const ded = amt - cr;
  if (ded > 0) lines.push([`Deducted — ${p.deductReason || (isRentReason(p) ? "Other" : reasonOf(p))}`, -ded]);
  lines.push([`Credited to rent — ${monLabel(p.month)}`, cr]);
  return {type:"RCT", no:p.rcptNo || "Number pending", code:p.rcptCode || "", month:p.month, u, p,
    lines, total:amt, rentCredit:cr, deducted:ded, balance:c?.balance||0,
    isPaid:p.status!=="pending" && p.status!=="rejected", pending:p.status==="pending", rejected:p.status==="rejected"};
}

async function doVerify(no, code){
  S.verify = {no, code, result:null}; S.busy = true; render();
  try {
    if (!S.db) throw {m:"Database unavailable. Open the page while signed in."};
    const n = normNo(no);
    if (!/^RCT-\d{4}-\d{6}$/.test(n)) S.verify.result = {ok:false, why:"Receipt numbers look like RCT-2026-000001. Check the number on the receipt."};
    else { const snap = await S.db.doc("receipts/"+n).get();
      if (!snap.exists) S.verify.result = {ok:false, why:"No receipt with this number exists."};
      else { const r = snap.data();
        if (normCode(r.code) !== normCode(code)) S.verify.result = {ok:false, why:"The verification code does not match this receipt number."};
        else if (r.status === "cancelled") S.verify.result = {ok:false, cancelled:true, why:`This receipt was cancelled by the landlord${r.cancelledAt?" on "+fmtD(r.cancelledAt):""}.`};
        else S.verify.result = {ok:true, no:n, r}; } }
  } catch(e){ S.verify.result = {ok:false, why:errText(e)}; }
  S.busy = false; render();
}

/* ---------- CSV ---------- */
const csvCell = v => { const t = String(v ?? ""); return /[",\n]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t; };
const toCSV = rows => "﻿" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
const statusName = u => u.status==="occupied"?"Rented":u.status==="left"?"Left":"Vacant";
const payStatus = p => p.status==="pending"?"Awaiting approval":p.status==="rejected"?"Rejected":"Received";
const PAY_HEAD = ["Receipt no.","Verification code","For month","Purpose","Amount","Credited to rent","Deducted","Deduction reason","Paid (date & time)","Approved","Method","Note","Status","Recorded by"];
const payRow = p => [p.rcptNo||"",p.rcptCode||"",monLabel(p.month),reasonOf(p),p.amount,credit(p),(Number(p.amount)||0)-credit(p),p.deductReason||"",fmtWhen(p),p.confirmedAt?fmtWhen({at:p.confirmedAt}):"",p.method,p.note,payStatus(p),p.by==="tenant"?"Tenant":"Landlord"];
function buildCSV(kind){
  if (kind === "units") return ["shops", [["Shop code","Shop","Floor","Tenant","Mobile","Business","Status","Monthly rent","Rent start","Left on","Months","Total rent","Paid","Balance"],
    ...S.units.map(u => { const c = calc(u); return [u.id,u.shopNo,u.floor,u.tenant,u.phone,u.business,statusName(u),u.rent,u.startDate,u.endDate||"",c?.months.length||0,c?.expected||0,c?.paid||0,c?.balance||0]; })]];
  if (kind === "payments") return ["payments", [["Shop code","Shop","Tenant",...PAY_HEAD],
    ...S.units.flatMap(u => (u.payments||[]).map(p => ({k:sortKey(p), r:[u.id,u.shopNo,u.tenant,...payRow(p)]}))).sort((a,b)=>b.k.localeCompare(a.k)).map(x=>x.r)]];
  if (kind === "months") return ["months", [["Month","Shops","Total rent","Collected","Remaining","Unpaid shops"],
    ...allMonths().map(k => { const r = monthRows(k); const due = r.reduce((s,x)=>s+x.rent,0), got = r.reduce((s,x)=>s+Math.min(x.rent,x.got),0); return [monLabel(k), r.length, due, got, due-got, r.filter(x=>x.left>0).length]; })]];
  if (kind === "month"){ const k = S.selMonth; return ["month-"+k, [["Shop code","Shop","Tenant","Mobile","Rent","Paid","Remaining","Date & time"],
    ...monthRows(k).map(r => [r.u.id,r.u.shopNo,r.u.tenant,r.u.phone,r.rent,r.got,r.left,r.when])]]; }
  if (kind === "invoices"){ const k = S.selMonth || curMonth(); return ["invoices-"+k, [["Invoice no.","Shop","Tenant","Mobile","Month","Total","Paid","Due","Status"],
    ...S.units.map(u=>invoiceData(u,k)).filter(Boolean).map(d => [d.no,d.u.shopNo,d.u.tenant,d.u.phone,monLabel(k),d.gross,d.paid,d.total,d.isPaid?"Paid":"Unpaid"])]]; }
  if (kind === "mine"){ const u = S.myUnit, c = calc(u);
    const rows = [[`${mkName()} — full statement`],["Shop",u.shopNo],["Shop code",u.id],["Tenant",u.tenant],["Rent start",fmtD(u.startDate)],["Monthly rent",u.rent],["Total rent to date",c.expected],["Total credited",c.paid],["Balance",c.balance],[],
      ["Month","Rent","Paid","Remaining","Status"], ...c.months.map(k => { const g = c.byMonth[k]||0; return [monLabel(k), c.rent, g, Math.max(0,c.rent-g), g>=c.rent?"Paid":g>0?"Part paid":isLate(u,k)?"Unpaid":"Not due yet"]; }), [],
      PAY_HEAD, ...[...(u.payments||[])].sort((a,b)=>sortKey(a).localeCompare(sortKey(b))).map(payRow)];
    return ["statement-"+u.id, rows]; }
}
async function exportCSV(kind){
  const [name, rows] = buildCSV(kind); const data = toCSV(rows); const filename = `rent-link-${name}-${todayISO()}.csv`;
  if (S.downloads){
    try { await S.downloads.save({filename, data}); toast("CSV saved"); return; }
    catch(e){ if (e?.code === "declined") return; if (e?.code === "rate_limited"){ toast("Please wait a moment and try again"); return; } }
  }
  try { await navigator.clipboard.writeText(data.replace(/^﻿/,"")); toast("CSV copied — paste it into Excel"); } catch { toast("Export failed"); }
}

/* ---------- payment proof images ---------- */
function compressImage(file){
  return new Promise((res, rej) => {
    if (!file || !file.type.startsWith("image/")) return rej({m:"Please upload an image (JPG, PNG or a screenshot)."});
    const fr = new FileReader();
    fr.onload = () => { const img = new Image(); img.onload = () => {
      let max = 1200, q = 0.72, out = "";
      for (let i = 0; i < 6; i++){
        const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width*k); c.height = Math.round(img.height*k); const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL("image/jpeg", q); if (out.length < 220000) break; max = Math.round(max*0.8); q = Math.max(0.45, q - 0.07);
      }
      res(out);
    }; img.onerror = () => rej({m:"This image could not be opened."}); img.src = fr.result; };
    fr.onerror = () => rej({m:"This image could not be read."}); fr.readAsDataURL(file);
  });
}
const proofLoading = new Set();
async function loadProof(pid){
  if (!S.db || S.proofCache[pid] || proofLoading.has(pid)) return;
  proofLoading.add(pid);
  try { const d = await S.db.doc("proofs/"+pid).get(); S.proofCache[pid] = d.exists ? d.data().img : ""; } catch { S.proofCache[pid] = ""; }
  proofLoading.delete(pid); if (!fieldsBusy()) render();
}
const proofImg = p => { if (!p.hasProof) return `<span class="hint">No proof</span>`; const src = S.proofCache[p.id]; if (src === undefined) loadProof(p.id);
  return src ? `<img class="proof-thumb" src="${esc(src)}" alt="Proof" data-proof="${esc(p.id)}">` : `<button type="button" class="btn sm" data-proof="${esc(p.id)}">Proof</button>`; };
const seenKey = code => "rlm-seen-" + code;
function seenSet(code){ try { return new Set(JSON.parse(localStorage.getItem(seenKey(code))||"[]")); } catch { return new Set(); } }
function markSeen(code, id){ try { const s = seenSet(code); s.add(id); localStorage.setItem(seenKey(code), JSON.stringify([...s].slice(-200))); } catch {} }

/* ---------- helpers ---------- */
function waNumber(p){ let d = String(p||"").replace(/\D/g,""); if (d.startsWith("00")) d = d.slice(2); if (d.startsWith("0")) d = "92" + d.slice(1); return d; }
function waLink(p, text){ const n = waNumber(p); return n ? `https://wa.me/${n}?text=${encodeURIComponent(text||"")}` : ""; }
async function copy(text, btn){
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch { const el = btn?.closest("[data-copy-scope]")?.querySelector(".mono"); if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Text selected — copy it now"); } else toast("Could not copy"); }
}
async function hashPin(code, pin){
  const msg = "rlm|" + code + "|" + pin;
  if (window.crypto?.subtle){ const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg)); return {alg:"sha256", h:[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("")}; }
  let h = 0x811c9dc5; for (const ch of msg){ h ^= ch.charCodeAt(0); h = Math.imul(h,16777619)>>>0; } return {alg:"fnv", h:h.toString(16)};
}
function rand(n){ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
function newCode(){ let c; do { c = "RL" + String(1000 + rand(9000)); } while (S.units.some(u => u.id === c)); return c; }
function newPin(){ const used = new Set(Object.values(S.pins)); let p, n = 0; do { p = String(rand(10000)).padStart(4,"0"); n++; } while (used.has(p) && n < 500); return p; }
const uid = () => Date.now().toString(36) + rand(1e6).toString(36);
let chain = Promise.resolve();
function write(fn){ const p = chain.then(fn); chain = p.catch(()=>{}); return p; }
function errText(e){
  if (e?.m) return e.m;
  const c = e?.code;
  if (c === "invalid_argument") return "Not saved: you don't have permission to write on this link. Ask the landlord for Contributor access.";
  if (c === "quota_exceeded") return "The database is full. Remove old records.";
  if (c === "unavailable" || c === "revoked") return "Connection lost. Reopen the page.";
  return "Not saved: " + (e?.message || "unknown error") + ". Please try again.";
}

function ledgerTable(list, admin, u){

    <td>${p.status==="rejected"||p.status==="pending"?"":`<button type="button" class="btn sm" data-rcpt="${esc(u.id)}|${esc(p.id)}">Receipt</button>`}</td>

async function tenantUpdate(fn, okMsg){
  const u = S.myUnit; if (!u) return;
  S.busy = true; S.msg = null; render();
  try { const fresh = await S.db.doc("units/"+u.id).get(); const patch = fn(fresh.data()); await write(()=>S.db.doc("units/"+u.id).update(patch)); setMsg("ok", okMsg); }
  catch(e){ setMsg("err", errText(e)); }
  S.busy = false; render();
}

async function setPin(code, pin){
  const h = await hashPin(code, pin);
  await write(()=>S.db.doc("auth/"+code).set({alg:h.alg, h:h.h, updatedAt:Date.now()}));
  const pins = {...S.pins, [code]:pin};
  await write(()=>S.db.doc("admin/pins").set({map:pins}));
  S.pins = pins;
}
async function unitUpdate(id, fn, okMsg){
  S.busy = true; S.msg = null; render();
  try { const snap = await S.db.doc("units/"+id).get(); const u = snap.exists ? {id, ...snap.data()} : S.units.find(x=>x.id===id); const patch = await fn(u); await write(()=>S.db.doc("units/"+id).update({...patch, updatedAt:Date.now()})); if (okMsg) setMsg("ok", typeof okMsg === "function" ? okMsg(patch) : okMsg); }
  catch(e){ setMsg("err", errText(e)); }
  S.busy = false; render();
}

document.addEventListener("click", async e => {
  const mrow = e.target.closest("tr[data-month]");
  if (mrow){ S.selMonth = mrow.dataset.month; render(); return; }
  if (e.target.matches("img[data-proof]")){ S.proofView = e.target.dataset.proof; renderOverlay(); return; }
  const row = e.target.closest("tr[data-unit]");
  if (row && !e.target.closest("button, img")){ S.view = "admin"; S.openUnit = row.dataset.unit; S.msg = null; S.editing = false; S.confirm = null; render(); scrollTo(0,0); return; }
  const t = e.target.closest("button, a"); if (!t) return;
  const d = t.dataset;
  if (d.tab){ S.view = d.tab; S.openUnit = null; S.msg = null; S.confirm = null; S.draft = null; render(); scrollTo(0,0); return; }
  if (d.close != null){ S.openUnit = null; S.msg = null; S.editing = false; S.confirm = null; render(); return; }
  if (d.filter){ S.filter = d.filter; render(); return; }
  if (d.csv){ exportCSV(d.csv); return; }
  if (d.inv){ const [id,month] = d.inv.split("|"); S.invoice = {id, month}; renderOverlay(); return; }
  if (d.rcpt){ const [id,pid] = d.rcpt.split("|"); if (d.seen && S.session) markSeen(S.session, d.seen); S.invoice = {id, pid}; render(); return; }
  if (d.closeInv != null){ S.invoice = null; S.proofView = null; renderOverlay(); return; }
  if (d.pdf != null){ downloadPDF(t); return; }
  if (d.proof){ S.proofView = d.proof; loadProof(d.proof); renderOverlay(); return; }
  if (d.seen){ if (S.session) markSeen(S.session, d.seen); render(); return; }
  if (d.addMethod != null){ readDraft(); S.draft.push({name:"",details:"",on:true}); render(); document.getElementById("s-mname-"+(S.draft.length-1))?.focus(); return; }
  if (d.rmMethod != null){ readDraft(); S.draft.splice(Number(d.rmMethod),1); render(); return; }
  if (d.copy != null){ copy(d.copy, t); return; }
  if (d.dismissSlip != null){ S.lastCreated = null; render(); return; }
  if (d.edit != null){ S.editing = !S.editing; render(); return; }
  if (d.ask){ const [kind,id] = d.ask.split(":"); S.confirm = {kind,id}; render(); return; }
  if (d.cancel != null){ S.confirm = null; render(); return; }
  if (d.logout != null){ S.myUnsub?.(); S.myUnsub = null; S.session = null; S.myUnit = null; store.set(SESSION_KEY, null); S.msg = null; render(); return; }
  if (d.approve || d.reject){ const [id,pid] = (d.approve||d.reject).split("|"); const ok = !!d.approve;
    const v = k => document.getElementById(`ap-${k}-${pid}`)?.value.trim() ?? "";
    const rentC = Math.max(0, Number(v("rent"))||0), ded = Math.max(0, Number(v("ded"))||0), why = v("why"), rej = v("rej");
    let issued = null;
    await unitUpdate(id, async u => { const now = new Date().toISOString(); const pays = [];
      for (const p of (u.payments||[])){
        if (p.id !== pid){ pays.push(p); continue; }
        if (!ok){ pays.push({...p, status:"rejected", confirmedAt:now, rejectReason:rej}); continue; }
        const np = {...p, status:"confirmed", confirmedAt:now, rentCredit:rentC, deductAmt:ded, deductReason:why};
        issued = await issueReceipt(u, np); pays.push({...np, ...issued});
      }
      return {payments:pays}; },
      () => ok ? `Approved: receipt ${issued?.rcptNo||""} issued (code ${issued?.rcptCode||""}). ${rsT(rentC)} credited to rent${ded?`, ${rsT(ded)} deducted (${why||"Other"})`:""}.` : "Payment rejected.");
    return; }
  if (d.delPay){ const id = S.openUnit, pid = d.delPay; S.confirm = null; const u = S.units.find(x=>x.id===id); const p = (u?.payments||[]).find(x=>x.id===pid);
    await unitUpdate(id, uu => ({payments:(uu.payments||[]).filter(x=>x.id!==pid)}), "Payment deleted. Its receipt number is now marked as cancelled.");
    await voidReceipt(p?.rcptNo);
    try { await write(()=>S.db.doc("proofs/"+pid).delete()); } catch {} return; }
  if (d.vacate){ const id = d.vacate; S.confirm = null; const u = S.units.find(x=>x.id===id); if (!u) return;
    S.busy = true; S.msg = null; render();
    try {
      await write(()=>S.db.doc("units/"+id).update({status:"left", endDate:todayISO(), updatedAt:Date.now()}));
      const code = newCode();
      await write(()=>S.db.doc("units/"+code).set({shopNo:u.shopNo, floor:u.floor||"", size:u.size||"", rent:u.rent, deposit:u.deposit||0, tenant:"", phone:"", business:"", startDate:"", dueDay:u.dueDay||5, status:"vacant", payments:[], prevCode:id, createdAt:Date.now(), updatedAt:Date.now()}));
      S.openUnit = code; setMsg("ok", `${u.tenant}'s record (Shop Code ${id}) is kept. ${u.shopNo} is now vacant. Press "Edit" to add the next tenant.`);
    } catch(err){ setMsg("err", errText(err)); }
    S.busy = false; render(); return; }
  if (d.delUnit){ const id = d.delUnit; S.confirm = null; const u = S.units.find(x=>x.id===id);
    try { await write(()=>S.db.doc("units/"+id).delete()); await write(()=>S.db.doc("auth/"+id).delete());
      const pins = {...S.pins}; delete pins[id]; await write(()=>S.db.doc("admin/pins").set({map:pins})); S.pins = pins;
      for (const p of (u?.payments||[])) await voidReceipt(p.rcptNo);
      S.openUnit = null; if (S.lastCreated?.code===id) S.lastCreated = null; setMsg("ok","Record deleted. Its receipts are marked as cancelled."); }
    catch(err){ setMsg("err", errText(err)); } render(); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (S.invoice || S.proofView)){ S.invoice = null; S.proofView = null; renderOverlay(); return; } if (e.key === "Enter" && e.target.matches("tr[data-unit], tr[data-month]")) e.target.click(); });
document.addEventListener("change", e => { if (e.target.id === "inv-month"){ S.selMonth = e.target.value; render(); } });
document.getElementById("overlay").addEventListener("click", e => { if (e.target.id === "overlay"){ S.invoice = null; S.proofView = null; renderOverlay(); } });
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "verifyForm") return doVerify(f.querySelector("#v-no").value.trim(), f.querySelector("#v-code").value.trim());
  if (f.id === "settingsForm"){ readDraft(); const g = id => f.querySelector("#s-"+id).value.trim();
    const next = {marketName:g("market")||BRAND, landlord:g("landlord"), landlordPhone:g("phone"), dueDay:Math.min(28,Math.max(1,Number(g("due"))||5)), methods:S.draft.filter(m=>m.name), updatedAt:Date.now()};
    S.busy = true; S.msg = null; render();
    try { await write(()=>S.db.doc("config/settings").set(next)); S.settings = next; S.draft = null; setMsg("ok","Settings saved. Tenants will see the updated payment methods."); }
    catch(err){ setMsg("err", errText(err)); }
    S.busy = false; render(); return; }
  if (f.id === "loginForm") return doLogin(f.querySelector("#l-code").value.trim().toUpperCase(), f.querySelector("#l-pin").value.trim());
  if (f.id === "addForm"){
    if (!S.db){ setMsg("err","Database unavailable."); render(); return; }
    const data = readUnitForm(f); const code = newCode(), pin = newPin();
    S.busy = true; S.msg = null; render();
    try {
      await write(()=>S.db.doc("units/"+code).set({...data, payments:[], createdAt:Date.now(), updatedAt:Date.now()}));
      if (data.tenant){ await setPin(code, pin); S.lastCreated = {code, pin, shopNo:data.shopNo, tenant:data.tenant, phone:data.phone};
        setMsg("ok", `${data.shopNo} added. ${data.tenant}'s Shop Code ${code} and PIN ${pin} are theirs for life.`); }
      else setMsg("ok", `${data.shopNo} added as a vacant shop. A code and PIN are created when you add a tenant.`);
    } catch(err){ setMsg("err", errText(err)); }
    S.busy = false; render(); return;
  }
  if (f.id === "editForm"){ const data = readUnitForm(f); const id = S.openUnit; const before = S.units.find(x=>x.id===id);
    const newTenant = data.status === "occupied" && !S.pins[id];
    if (before?.status === "occupied" && data.status !== "occupied"){ setMsg("err","Don't clear the tenant's name. To end a tenancy, use the \"Vacate shop\" button."); render(); return; }
    await unitUpdate(id, () => ({...data, startDate: data.tenant ? data.startDate : ""}), "Shop details saved."); S.editing = false;
    if (newTenant && S.msg?.t === "ok"){ const pin = newPin(); try { await setPin(id, pin); S.lastCreated = {code:id, pin, shopNo:data.shopNo, tenant:data.tenant, phone:data.phone}; setMsg("ok", `${data.tenant}'s Shop Code ${id} and PIN ${pin} have been created. They are theirs for life.`); } catch(err){ setMsg("err", errText(err)); } }
    render(); return; }
  if (f.id === "payForm"){ const g = id => f.querySelector("#p-"+id).value.trim(); const now = new Date().toISOString();
    const amount = Number(g("amount"))||0, reason = g("reason"), ded = Math.min(amount, Math.max(0, Number(g("ded"))||0));
    const rentCredit = reason === RENT ? amount - ded : 0;
    const p = {id:uid(), month:g("month"), amount, at:now, method:g("method"), reason, note:g("note"), status:"confirmed", by:"admin", confirmedAt:now, rentCredit, deductAmt: reason===RENT ? ded : amount, deductReason: reason===RENT ? g("why") : reason};
    let issued = null;
    await unitUpdate(S.openUnit, async u => { issued = await issueReceipt(u, p); return {payments:[...(u.payments||[]), {...p, ...issued}]}; },
      () => `${rsT(amount)} recorded (${reason}), ${rsT(rentCredit)} credited to rent. Receipt ${issued?.rcptNo} · code ${issued?.rcptCode}.`); return; }
  if (f.id === "claimForm"){ const g = id => f.querySelector("#c-"+id).value.trim(); const file = f.querySelector("#c-proof").files?.[0];
    const p = {id:uid(), month:g("month"), amount:Number(g("amount"))||0, at:new Date().toISOString(), method:g("method"), reason:g("reason"), note:g("note"), status:"pending", by:"tenant", hasProof:false};
    S.busy = true; S.msg = null; render();
    try {
      if (file){ const img = await compressImage(file); await write(()=>S.db.doc("proofs/"+p.id).set({img, unit:S.session, at:p.at})); p.hasProof = true; S.proofCache[p.id] = img; }
    } catch(err){ S.busy = false; setMsg("err", errText(err)); render(); return; }
    S.busy = false;
    await tenantUpdate(cur => ({payments:[...(cur.payments||[]), p], updatedAt:Date.now()}), "Payment uploaded. Your numbered receipt will appear here as soon as the landlord approves it."); return; }
  if (f.id === "tenantInfo"){ const phone = f.querySelector("#t-phone").value.trim(), business = f.querySelector("#t-business").value.trim();
    await tenantUpdate(() => ({phone, business, updatedAt:Date.now()}), "Details saved."); return; }
});

/* ---------- start ---------- */
S.session = store.get(SESSION_KEY);
document.getElementById("foot-date").textContent = fmtD(todayISO());
render();
(async () => {
  const use = window.claude?.use;
  const [db, user, dl] = use ? await Promise.all([use("db"), use("user"), use("downloads")]) : [null, null, null];
  S.db = db; S.downloads = dl;
  S.isOwner = user ? await user.isOwner().catch(()=>false) : false;
  const h = (location.hash||"").slice(1);
  S.view = h === "verify" ? "verify" : S.isOwner && h !== "login" ? (["months","invoices","settings"].includes(h) ? h : "admin") : "login";
  if (!db){ S.dbMissing = true; S.ready = true; render(); return; }
  db.doc("config/settings").onSnapshot(snap => { if (snap.exists){ S.settings = {...DEFAULT_SETTINGS, ...snap.data()}; if (!fieldsBusy() && S.view !== "settings") render(); } }, () => {});
  if (S.session) subscribeMine();
  if (S.isOwner){
    try { const p = await db.doc("admin/pins").get(); if (p.exists) S.pins = p.data().map || {}; } catch {}
    try { await ensureSecrets(); } catch {}
    db.collection("units").limit(1000).onSnapshot(snap => {
      S.units = snap.docs.map(d => ({id:d.id, ...d.data()})); S.ready = true;
      if (!fieldsBusy()) render();
      migrateReceipts();
    }, () => { S.ready = true; render(); });
    setTimeout(()=>{ if (!S.ready){ S.ready = true; render(); } }, 8000);
  } else { S.ready = true; render(); }
})();
})();
</script>
