<title>Market Kiraya Khata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ledger app — sticky header, owner tabs (Dukanein / Nayi Dukaan / Settings), shop detail as a khata page; tenant view = code + PIN lookup + lifetime statement */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunk:#F2F6F3; --ink:#15221C; --muted:#5B6B63; --line:#CCD7D0;
  --accent:#0D6B4E; --accent-ink:#FFFFFF; --accent-soft:#D5EBE1;
  --due:#B3261E; --due-soft:#F8E1DE; --ok:#1F7A3F; --ok-soft:#DDF1E2; --warn:#8A5A00; --warn-soft:#F7EBCF;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; color-scheme:light;
}
.paybox{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.paybox b{font-family:var(--f-mono);font-size:15px;overflow-wrap:anywhere}
.pm-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:640px){.pm-row{grid-template-columns:1fr}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{width:36px;height:36px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.brand h1{font-family:var(--f-display);font-size:19px;margin:0;line-height:1.15;text-wrap:balance}
.brand small{display:block;color:var(--muted);font-size:12.5px}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:16px}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:600 13.5px var(--f-body);padding:7px 14px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
main{padding-block:22px 60px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-display);font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-size:17px;margin:0}
.lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat.due b{color:var(--due)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:600 14px var(--f-body);border-radius:8px;padding:9px 15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--due)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:13px;white-space:nowrap}
.code.big{font-size:22px;padding:6px 14px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill.paid{background:var(--ok-soft);color:var(--ok)}
.pill.part{background:var(--warn-soft);color:var(--warn)}
.pill.due{background:var(--due-soft);color:var(--due)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
.muted{color:var(--muted)}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.msg{padding:10px 13px;border-radius:8px;font-size:14px}
.msg.err{background:var(--due-soft);color:var(--due)}
.msg.ok{background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 20px}
.kv div{min-width:0}
.kv span{display:block;font-weight:600;overflow-wrap:anywhere}
.back{border:0;background:none;color:var(--accent);font:600 14px var(--f-body);cursor:pointer;padding:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(5,12,9,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:640px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px}
/* invoice */
.inv{background:#fff;color:#16211c;border:1px solid #cfd8d2;border-radius:8px;padding:22px;font-family:var(--f-body)}
.inv .ih{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:2px solid #0D6B4E;padding-bottom:12px}
.inv h4{font-family:var(--f-display);font-size:22px;margin:0;color:#0D6B4E}
.inv .t{font-family:var(--f-display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#5b6b63;text-align:right}
.inv table{min-width:0;margin-top:14px}
.inv th{background:#eef2ef;color:#5b6b63}
.inv td,.inv th{border-bottom:1px solid #dfe6e1;padding:8px 10px}
.inv .tot td{font-weight:700;font-size:16px;border-top:2px solid #16211c}
.inv .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px 16px;margin-top:14px;font-size:14px}
.inv .meta b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6b63}
.inv .stamp{margin-top:14px;display:inline-block;border:2px solid currentColor;padding:3px 12px;border-radius:6px;font-weight:700;letter-spacing:.08em;transform:rotate(-3deg)}
.lookup{max-width:520px;margin:30px auto 0;text-align:center;display:flex;flex-direction:column;gap:14px}
.lookup form{display:flex;gap:8px}
.lookup input{font-family:var(--f-mono);font-size:18px;text-transform:uppercase;letter-spacing:.06em;text-align:center}
@media (max-width:560px){.lookup form{flex-direction:column}nav.tabs{width:100%}nav.tabs button{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><div class="mark" id="markLetter">K</div><div style="min-width:0"><h1 id="mktName">Market Kiraya Khata</h1><small id="mktSub">Dukanon ka kiraya, ek jagah</small></div></div>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="shops" aria-selected="true">Dukanein</button>
    <button data-tab="add" aria-selected="false">Nayi Dukaan</button>
    <button data-tab="invoices" aria-selected="false">Invoices</button>
    <button data-tab="settings" aria-selected="false">Settings</button>
    <button data-tab="tenant" aria-selected="false">Karayadar View</button>
  </nav>
</div></header>

<main class="wrap" id="app">
  <div class="empty"><h3>Load ho raha hai…</h3><p>Market ka data aa raha hai.</p></div>
</main>

<script>
(function(){
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'Rs. '+(Math.round(Number(n)||0)).toLocaleString('en-PK');
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthLabel=m=>{if(!m)return'';const[y,mm]=m.split('-');return MONTHS[+mm-1]+' '+y};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const thisMonth=()=>today().slice(0,7);
const norm=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,'');
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
function genCode(){let s='';for(let i=0;i<6;i++)s+=ALPH[rnd(ALPH.length)];return 'MK-'+s}
function genPin(){return String(1000+rnd(9000))}
const uid=()=>Date.now().toString(36)+rnd(1e6).toString(36);

/* --- hisaab --- */
const payList=e=>Array.isArray(e.payments)?e.payments:[];
function entryCalc(e){const due=(+e.rent||0)+(+e.extra||0);const paid=payList(e).reduce((a,p)=>a+(+p.amount||0),0)+(+e.paid||0);return{due,paid,bal:due-paid}}
function status(e){const c=entryCalc(e);if(c.bal<=0)return['paid','Ada'];if(c.paid>0)return['part','Kuch baqi'];return['due','Baqaya']}
function shopTotals(s){let due=0,paid=0;(s.entries||[]).forEach(e=>{const c=entryCalc(e);due+=c.due;paid+=c.paid});return{due,paid,bal:due-paid}}
function invNo(s,e){return 'INV-'+s.code.replace('MK-','')+'-'+e.month.replace('-','')}
const sortE=s=>[...(s.entries||[])].sort((a,b)=>b.month.localeCompare(a.month));

/* --- PIN + code se lock (karayadar ka data sirf sahi code+PIN se khulta hai) --- */
const te=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function portalId(code,pin){return hex(await crypto.subtle.digest('SHA-256',te.encode('mkk-id|'+code+'|'+pin))).slice(0,40)}
async function portalKey(code,pin){const base=await crypto.subtle.importKey('raw',te.encode(code+'|'+pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:te.encode('mkk-v1|'+code),iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sealShop(s){const{pin,...pub}=s;const iv=crypto.getRandomValues(new Uint8Array(12));const k=await portalKey(s.code,s.pin);
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te.encode(JSON.stringify(pub)));return{v:1,iv:b64(iv),ct:b64(ct),updatedAt:new Date().toISOString()}}
async function openPortal(doc,code,pin){const k=await portalKey(code,pin);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(doc.iv)},k,unb64(doc.ct));return JSON.parse(new TextDecoder().decode(pt))}

let toastT;function toast(t){let el=$('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copy ho gaya')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Copy ho gaya')}catch(_){toast('Copy nahi hua, khud select karein')}ta.remove()}}

let db=null,downloads=null,isAdmin=false;
let settings={marketName:'',ownerName:'',phone:'',address:'',payMethods:[]};
let shops=[],loaded=false,invMonth=null;
let view={tab:'shops',shop:null,q:'',showOld:false};
let tenantShop=null,tenantErr='',tenantCred=null,tenantUnsub=null;
const pms=()=>Array.isArray(settings.payMethods)?settings.payMethods:[];
const methodOptions=()=>[...new Set(['Cash',...pms().map(p=>p.title).filter(Boolean),'Bank transfer','JazzCash','Easypaisa','Cheque'])];
function payHTML(){const l=pms();if(!l.length)return'';return `<div class="grid g2">${l.map(p=>`<div class="paybox"><span class="lbl">${esc(p.title)}</span><b style="user-select:all">${esc(p.number)}</b><span class="muted">${esc(p.holder||'')}</span></div>`).join('')}</div>`}
const active=()=>shops.filter(s=>!s.closed);

function applySettings(){
  const n=settings.marketName||'Market Kiraya Khata';
  $('#mktName').textContent=n;$('#markLetter').textContent=(n.trim()[0]||'K').toUpperCase();
  $('#mktSub').textContent=settings.address||(isAdmin?'Malik panel':'Karayadar: code aur PIN se apna kiraya dekhein');
}
function refresh(){try{document.activeElement&&document.activeElement.blur()}catch(_){}render()}

/* --- save: malik ka record + karayadar ka band (locked) record, dono --- */
async function saveShop(s,{oldPin}={}){
  await db.doc('shops/'+s.code).set(s);
  if(s.pin){await db.doc('portal/'+await portalId(s.code,s.pin)).set(await sealShop(s))}
  if(oldPin&&oldPin!==s.pin){try{await db.doc('portal/'+await portalId(s.code,oldPin)).delete()}catch(_){}}
}
const clone=s=>JSON.parse(JSON.stringify(s));

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===view.tab)));
  if(!db){app.innerHTML=`<div class="panel empty"><h3>Data nahi khul raha</h3><p>Is page ko dekhne ke liye claude.ai par sign in karein, phir page reload karein.</p></div>`;return}
  if(!isAdmin||view.tab==='tenant')return renderTenant();
  if(view.tab==='add')return renderAdd();
  if(view.tab==='settings')return renderSettings();
  if(view.tab==='invoices')return renderInvoices();
  if(view.shop)return renderShop();
  return renderShops();
}

function renderShops(){
  const m=thisMonth();const act=active();
  let tDue=0,tPaid=0,monthIn=0,pendingMonth=0;
  act.forEach(s=>{const t=shopTotals(s);tDue+=t.due;tPaid+=t.paid;const e=(s.entries||[]).find(x=>x.month===m);if(e)monthIn+=entryCalc(e).paid;if(!e||entryCalc(e).bal>0)pendingMonth++});
  const q=norm(view.q);const base=view.showOld?shops.filter(s=>s.closed):act;
  const list=base.filter(s=>!q||norm(s.shopNo).includes(q)||norm(s.tenant).includes(q)||norm(s.code).includes(q)).sort((a,b)=>String(a.shopNo).localeCompare(String(b.shopNo),undefined,{numeric:true}));
  const noPin=shops.filter(s=>!s.pin);const oldCount=shops.length-act.length;
  app.innerHTML=`
  <div class="spread"><h2>${view.showOld?'Purane karayadar':'Dukanein'}</h2><div class="row">${oldCount?`<button class="btn" id="tglOld">${view.showOld?'Mojooda dukanein':'Purane karayadar ('+oldCount+')'}</button>`:''}<button class="btn pri" id="goAdd">+ Nayi Dukaan</button></div></div>
  ${noPin.length?`<div class="msg err spread"><span>${noPin.length} dukanon ka PIN abhi nahi bana. PIN ke baghair karayadar apna data nahi dekh sakta.</span><button class="btn sm pri" id="mkPins">Sab ke PIN banayein</button></div>`:''}
  <div class="grid g4">
    <div class="stat"><span class="lbl">Mojooda dukanein</span><b>${act.length}</b></div>
    <div class="stat"><span class="lbl">${esc(monthLabel(m))} wasooli</span><b>${rs(monthIn)}</b></div>
    <div class="stat"><span class="lbl">Is mahine baqi dukanein</span><b>${pendingMonth}</b></div>
    <div class="stat due"><span class="lbl">Kul baqaya</span><b>${rs(tDue-tPaid)}</b></div>
  </div>
  ${shops.length?`<input id="q" type="search" placeholder="Dukaan number, naam ya code se dhoondein" value="${esc(view.q)}">`:''}
  ${!loaded?`<div class="panel empty"><h3>Load ho raha hai…</h3></div>`:
   !shops.length?`<div class="panel empty"><h3>Abhi koi dukaan add nahi hui</h3><p>"Nayi Dukaan" se market ki dukanein add karein. Har dukaan ko pakka code aur PIN milega.</p></div>`:
   `<div class="tbl-wrap"><table><thead><tr><th>Dukaan #</th><th>Karayadar</th><th>Code</th><th class="num">Mahana kiraya</th><th>${esc(monthLabel(m))}</th><th class="num">Kul baqaya</th></tr></thead><tbody>
   ${list.map(s=>{const t=shopTotals(s);const e=(s.entries||[]).find(x=>x.month===m);const st=s.closed?['part','Dukaan chhor di']:e?status(e):['due','Nahi likha'];
     return `<tr class="click" data-code="${esc(s.code)}"><td><b>${esc(s.shopNo)}</b></td><td>${esc(s.tenant)}<div class="muted" style="font-size:13px">${esc(s.phone||'')}</div></td><td><span class="code">${esc(s.code)}</span></td><td class="num">${rs(s.monthlyRent)}</td><td><span class="pill ${st[0]}">${st[1]}</span></td><td class="num" style="${t.bal>0?'color:var(--due);font-weight:600':''}">${rs(t.bal)}</td></tr>`}).join('')}
   ${!list.length?`<tr><td colspan="6" class="muted">Koi dukaan nahi mili.</td></tr>`:''}
   </tbody></table></div>`}`;
  $('#goAdd').onclick=()=>{view.tab='add';render()};
  const to=$('#tglOld');if(to)to.onclick=()=>{view.showOld=!view.showOld;renderShops()};
  const mp=$('#mkPins');if(mp)mp.onclick=async()=>{mp.disabled=true;try{for(const s of noPin){const n=clone(s);n.pin=genPin();await saveShop(n)}toast('Sab dukanon ke PIN ban gaye')}catch(e){toast('Nahi hua: '+(e.code||e.message))}refresh()};
  const qi=$('#q');if(qi){qi.oninput=()=>{view.q=qi.value;const p=qi.selectionStart;renderShops();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
  app.querySelectorAll('tr.click').forEach(tr=>tr.onclick=()=>{view.shop=tr.dataset.code;render()});
}

function newShopDoc(f){return{code:f.code,pin:genPin(),shopNo:f.shopNo,shopKey:norm(f.shopNo),tenant:f.tenant,phone:f.phone||'',cnic:f.cnic||'',monthlyRent:+f.monthlyRent||0,
  startDate:f.startDate||today(),security:+f.security||0,business:f.business||'',note:f.note||'',entries:[],closed:false,createdAt:new Date().toISOString()}}
async function freshCode(){let code;for(let i=0;i<8;i++){code=genCode();if(shops.some(s=>s.code===code))continue;const ex=await db.doc('shops/'+code).get();if(!ex.exists)return code}return code}

function renderAdd(){
  app.innerHTML=`
  <h2>Nayi Dukaan Add Karein</h2>
  <p class="muted" style="margin:0;max-width:65ch">Har dukaan sirf ek baar add hoti hai. Add karte hi karayadar ka pakka code aur PIN ban jata hai. Code kabhi nahi badalta. Phir har mahine ka kiraya aur payment usi dukaan mein likhein.</p>
  <form class="panel grid" id="addForm" style="gap:14px">
    <div class="grid g2">
      <label class="f">Dukaan number *<input id="a_no" required placeholder="maslan 12 ya A-07"></label>
      <label class="f">Karayadar ka naam *<input id="a_tenant" required placeholder="maslan Muhammad Aslam"></label>
      <label class="f">Mobile number<input id="a_phone" inputmode="tel" placeholder="03xx-xxxxxxx"></label>
      <label class="f">CNIC<input id="a_cnic" placeholder="xxxxx-xxxxxxx-x"></label>
      <label class="f">Mahana kiraya (Rs.) *<input id="a_rent" type="number" min="0" step="1" required placeholder="15000"></label>
      <label class="f">Kiraya shuru tareekh<input id="a_start" type="date" value="${today()}"></label>

async function bulkAdd(text,msgEl,btn){
  const lines=text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const seen=new Set(active().map(s=>norm(s.shopNo)));let added=[],skipped=[],bad=[];
  btn.disabled=true;btn.textContent='Add ho rahi hain…';
  for(const l of lines){
    const p=l.split(/[,\t]/).map(x=>x.trim());
    const no=p[0],tenant=p[1],phone=p[2]||'',rent=String(p[3]||'').replace(/[^0-9.]/g,'');
    if(!no||!tenant){bad.push(l);continue}
    if(seen.has(norm(no))){skipped.push(no);continue}
    try{const s=newShopDoc({code:await freshCode(),shopNo:no,tenant,phone,monthlyRent:rent});await saveShop(s);shops.push(s);seen.add(norm(no));added.push(no)}catch(e){bad.push(l)}
  }
  btn.disabled=false;btn.textContent='Sab dukanein add karein';
  msgEl.innerHTML=`<div class="msg ${added.length?'ok':'err'}">${added.length} dukanein add ho gayin${added.length?': '+esc(added.join(', ')):''}.${skipped.length?`<br>Pehle se mojood, chhor di gayin: ${esc(skipped.join(', '))}.`:''}${bad.length?`<br>Yeh lines samajh nahi aayin: ${esc(bad.join(' | '))}`:''}</div>`;
  if(added.length)$('#bulkText').value='';
}

function entryTable(s,entries,owner){

  ${entries.map(e=>{const c=entryCalc(e);const st=status(e);const ps=payList(e);
    return `<tr><td><b>${esc(monthLabel(e.month))}</b>${e.note?`<div class="muted" style="font-size:12.5px">${esc(e.note)}</div>`:''}</td><td class="num">${rs(e.rent)}</td><td class="num">${rs(e.extra)}${e.extraNote?`<div class="muted" style="font-size:12.5px">${esc(e.extraNote)}</div>`:''}</td><td class="num">${rs(c.due)}</td><td class="num">${rs(c.paid)}</td><td class="num">${rs(Math.max(c.bal,0))}</td><td><span class="pill ${st[0]}">${st[1]}</span></td>
    <td><div class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm pri" data-inv="${esc(e.month)}">Invoice</button>${owner?`<button class="btn sm" data-edit="${esc(e.month)}">Bill badlein</button>`:''}</div></td></tr>
    ${ps.length||(+e.paid)?`<tr><td colspan="8" style="background:var(--sunk);padding:8px 12px 10px 28px"><span class="lbl">Payments</span>
      ${(+e.paid)?`<div style="font-size:13.5px">${rs(e.paid)} · pehle se likha</div>`:''}
      ${ps.map(p=>`<div class="row" style="gap:10px;font-size:13.5px;${p.void?'text-decoration:line-through;color:var(--muted)':''}"><b>${rs(p.void?p.amountWas:p.amount)}</b><span>${esc(p.date)}</span><span>${esc(p.method)}</span>${p.ref?`<span class="code" style="font-size:12px">${esc(p.ref)}</span>`:''}${p.void?'<span>(ghalat, cancel)</span>':''}${!p.void?`<button class="btn sm" data-rcp="${esc(e.month)}|${esc(p.id)}">Raseed</button>`:''}${owner&&!p.void?`<button class="btn sm danger" data-undo="${esc(e.month)}|${esc(p.id)}">Ghalat</button>`:''}</div>`).join('')}
    </td></tr>`:''}`}).join('')}
  ${entries.length>1?(()=>{const t=shopTotals(s);return `<tr><td><b>Kul</b></td><td></td><td></td><td class="num"><b>${rs(t.due)}</b></td><td class="num"><b>${rs(t.paid)}</b></td><td class="num" style="${t.bal>0?'color:var(--due)':''}"><b>${rs(t.bal)}</b></td><td colspan="2"></td></tr>`})():''}
  </tbody></table></div>`;
}
function bindEntryTable(s){app.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>openInvoice(s,s.entries.find(e=>e.month===b.dataset.inv)));

function renderInvoices(){
  const m=invMonth||thisMonth();
  const rows=shops.filter(s=>!s.closed||(s.entries||[]).some(x=>x.month===m)).sort((a,b)=>String(a.shopNo).localeCompare(String(b.shopNo),undefined,{numeric:true})).map(s=>({s,e:(s.entries||[]).find(x=>x.month===m)}));
  const withE=rows.filter(r=>r.e);let due=0,paid=0;withE.forEach(r=>{const c=entryCalc(r.e);due+=c.due;paid+=c.paid});
  app.innerHTML=`<div class="spread"><h2>Invoices</h2><label class="f" style="flex-direction:row;align-items:center;gap:8px">Mahina<input id="invM" type="month" value="${esc(m)}" style="width:auto"></label></div>
  <div class="grid g4">
    <div class="stat"><span class="lbl">Invoices tayyar</span><b>${withE.length} / ${rows.length}</b></div>
    <div class="stat"><span class="lbl">Kul banta hai</span><b>${rs(due)}</b></div>
    <div class="stat"><span class="lbl">Wasool</span><b>${rs(paid)}</b></div>
    <div class="stat ${due-paid>0?'due':''}"><span class="lbl">Baqi</span><b>${rs(due-paid)}</b></div>
  </div>
  ${withE.length&&downloads?`<div class="row"><button class="btn pri" id="allDl">${esc(monthLabel(m))} ki sab invoices download</button><span class="muted" style="font-size:13px">Ek file mein saari invoices, print ke liye.</span></div>`:''}
  ${!rows.length?`<div class="panel empty"><h3>Abhi koi dukaan nahi</h3><p>Pehle "Nayi Dukaan" se market ki dukanein add karein.</p></div>`:
  `<div class="tbl-wrap"><table><thead><tr><th>Dukaan #</th><th>Karayadar</th><th>Invoice #</th><th class="num">Kul</th><th class="num">Jama</th><th class="num">Baqi</th><th>Halat</th><th></th></tr></thead><tbody>
  ${rows.map(({s,e})=>{if(!e)return `<tr><td><b>${esc(s.shopNo)}</b></td><td>${esc(s.tenant)}</td><td class="muted">—</td><td></td><td></td><td></td><td><span class="pill due">Bill nahi likha</span></td><td><button class="btn sm" data-open="${esc(s.code)}">Bill likhein</button></td></tr>`;
    const c=entryCalc(e),st=status(e);return `<tr><td><b>${esc(s.shopNo)}</b></td><td>${esc(s.tenant)}</td><td><span class="code">${esc(invNo(s,e))}</span></td><td class="num">${rs(c.due)}</td><td class="num">${rs(c.paid)}</td><td class="num">${rs(Math.max(c.bal,0))}</td><td><span class="pill ${st[0]}">${st[1]}</span></td><td><button class="btn sm pri" data-inv="${esc(s.code)}">Invoice</button></td></tr>`}).join('')}
  </tbody></table></div>`}`;
  $('#invM').onchange=ev=>{invMonth=ev.target.value||thisMonth();renderInvoices()};
  app.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{const s=shops.find(x=>x.code===b.dataset.inv);openInvoice(s,s.entries.find(e=>e.month===m))});
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{view.tab='shops';view.shop=b.dataset.open;render()});
  const ad=$('#allDl');if(ad)ad.onclick=async()=>{const body=withE.map(r=>invoiceBody(r.s,r.e)).join('<div style="page-break-after:always;height:28px"></div>');
    try{await downloads.save({filename:'Invoices-'+m+'.html',data:new Blob([invoiceFile(null,null,body,'Invoices '+monthLabel(m))],{type:'text/html'})});toast('Invoices save ho gayin')}catch(er){if(er&&er.code!=='declined')toast('Download nahi hua')}};
}

/* ---------- karayadar ---------- */
function savedCode(){try{return localStorage.getItem('mkk-code')||''}catch(_){return''}}
function renderTenant(){
  if(!tenantShop){
    const pre=(location.hash.slice(1).match(/^MK-[A-Z0-9]{6}$/i)||[])[0]||savedCode();
    app.innerHTML=`<div class="lookup">
      <h2>Apna kiraya dekhein</h2>
      <p class="muted" style="margin:0">Malik ka diya hua dukaan code aur 4 hindson ka PIN daalein.</p>
      <form id="lk" style="flex-direction:column">
        <label class="f" style="text-align:left">Dukaan code<input id="lkCode" autocomplete="off" placeholder="MK-XXXXXX" value="${esc(pre)}" required></label>
        <label class="f" style="text-align:left">PIN<input id="lkPin" type="password" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="••••" required></label>
        <button class="btn pri" type="submit" id="lkBtn" style="justify-content:center">Apna record kholein</button></form>
      ${tenantErr?`<div class="msg err">${esc(tenantErr)}</div>`:''}
    </div>`;
    $('#lk').onsubmit=ev=>{ev.preventDefault();lookup($('#lkCode').value,$('#lkPin').value)};return;
  }
  const s=tenantShop;const t=shopTotals(s);const entries=sortE(s);
  const curBal=Math.max(t.bal,0);
  app.innerHTML=`
  <button class="back" id="tOut">← Bahar niklein</button>
  ${s.closed?`<div class="msg err">Yeh dukaan ${esc(s.closedAt||'')} ko chhor di gayi. Aap ka poora record yahan mehfooz hai.</div>`:''}
  <div class="spread"><div><span class="lbl">${esc(settings.marketName||'Market')} · Dukaan ${esc(s.shopNo)}</span><h2>${esc(s.tenant)}</h2></div><span class="code big">${esc(s.code)}</span></div>
  <div class="grid g4">
    <div class="stat"><span class="lbl">Mahana kiraya</span><b>${rs(s.monthlyRent)}</b></div>
    <div class="stat"><span class="lbl">Kul banta hai</span><b>${rs(t.due)}</b></div>
    <div class="stat"><span class="lbl">Aap ne jama kiya</span><b>${rs(t.paid)}</b></div>
    <div class="stat ${t.bal>0?'due':''}"><span class="lbl">Baqaya</span><b>${rs(t.bal)}</b></div>
  </div>
  <div class="panel grid" style="gap:12px"><h3>Kiraya jama karwayein</h3>
    ${pms().length?`<p class="muted" style="margin:0">Neeche diye gaye kisi bhi account mein ${curBal?'<b>'+rs(curBal)+'</b>':'kiraya'} bhejein.</p>${payHTML()}`:`<p class="muted" style="margin:0">Kiraya malik ko cash ya unke bataye account mein jama karwayein.</p>`}
    <form id="tPay" class="grid g2" style="gap:10px">
      <label class="f">Raqam (Rs.)<input id="tp_amt" type="number" min="1" value="${curBal||''}"></label>
      <label class="f">Tareeqa<select id="tp_method">${methodOptions().map(m=>`<option>${esc(m)}</option>`).join('')}</select></label>
      <label class="f">Transaction ID<input id="tp_ref" placeholder="Payment ke baad milne wala TID"></label>
      <div style="display:flex;align-items:end"><button class="btn pri" type="submit" style="width:100%;justify-content:center">Malik ke liye message copy karein</button></div>
    </form>
    <p class="muted" style="margin:0;font-size:13px">Payment bhejne ke baad yeh message WhatsApp par malik ko bhejein${settings.phone?' (<b style="user-select:all">'+esc(settings.phone)+'</b>)':''}. Malik ke tasdeeq karte hi payment aap ke record mein aa jayegi.</p>
  </div>
  <div class="panel"><h3 style="margin-bottom:12px">Aap ki dukaan ki detail</h3>
    <div class="kv">
      <div><span class="lbl">Dukaan #</span><span>${esc(s.shopNo)}</span></div>
      <div><span class="lbl">Karayadar</span><span>${esc(s.tenant)}</span></div>
      <div><span class="lbl">Mobile</span><span>${esc(s.phone||'—')}</span></div>
      <div><span class="lbl">CNIC</span><span>${esc(s.cnic||'—')}</span></div>
      <div><span class="lbl">Karobar</span><span>${esc(s.business||'—')}</span></div>
      <div><span class="lbl">Kiraya shuru tareekh</span><span>${esc(s.startDate||'—')}</span></div>
      <div><span class="lbl">Security / advance</span><span>${rs(s.security||0)}</span></div>
      <div><span class="lbl">Note</span><span>${esc(s.note||'—')}</span></div>
    </div>
  </div>
  <div class="spread"><h3>Poori umar ka kiraya record</h3><span class="muted">${entries.length} mahine</span></div>
  ${entries.length?entryTable(s,entries,false):`<div class="panel empty"><h3>Abhi koi kiraya record nahi</h3><p>Jab malik mahine ka bill likhega, yahan nazar aayega.</p></div>`}`;
  $('#tOut').onclick=()=>{tenantShop=null;tenantErr='';tenantCred=null;if(tenantUnsub){tenantUnsub();tenantUnsub=null}renderTenant()};
  $('#tPay').onsubmit=ev=>{ev.preventDefault();const a=+$('#tp_amt').value||0;
    copy(`Assalam o Alaikum,\nMain ne kiraya jama karwa diya hai.\nDukaan: ${s.shopNo} (Code ${s.code})\nNaam: ${s.tenant}\nRaqam: ${rs(a)}\nTareeqa: ${$('#tp_method').value}\nTransaction ID: ${$('#tp_ref').value.trim()||'—'}\nTareekh: ${today()}\nMeherbani karke record mein likh dein.`)};
  bindEntryTable(s);
}
async function lookup(rawCode,rawPin){
  let c=norm(rawCode);if(c&&!c.startsWith('MK-'))c='MK-'+c.replace(/^MK/,'');
  const pin=String(rawPin||'').trim();
  if(!/^MK-[A-Z0-9]{6}$/.test(c)){tenantErr='Code sahi nahi. Code is tarah hota hai: MK- aur 6 huroof/number.';renderTenant();return}
  if(!/^\d{4}$/.test(pin)){tenantErr='PIN 4 hindson ka hota hai.';renderTenant();return}
  const btn=$('#lkBtn');if(btn){btn.disabled=true;btn.textContent='Khul raha hai…'}
  try{const id=await portalId(c,pin);const ref=db.doc('portal/'+id);const snap=await ref.get();
    if(!snap.exists){tenantErr='Code ya PIN ghalat hai. Malik se confirm karein.';renderTenant();return}
    tenantShop=await openPortal(snap.data(),c,pin);tenantCred={c,pin};tenantErr='';try{localStorage.setItem('mkk-code',c)}catch(_){}
    renderTenant();
    if(tenantUnsub)tenantUnsub();
    tenantUnsub=ref.onSnapshot(async sn=>{if(sn.exists&&tenantCred){try{const d=await openPortal(sn.data(),c,pin);if(JSON.stringify(d)!==JSON.stringify(tenantShop)){tenantShop=d;const a=document.activeElement;if(!(a&&a.matches&&a.matches('input,select')))renderTenant()}}catch(_){}}},()=>{});
  }catch(e){tenantErr='Abhi record nahi khula. Thori dair baad koshish karein.';renderTenant()}
}

/* ---------- invoice ---------- */
function invoiceBody(s,e){
  const c=entryCalc(e);const st=status(e);const ps=payList(e).filter(p=>!p.void);
  const col=st[0]==='paid'?'#1F7A3F':st[0]==='part'?'#8A5A00':'#B3261E';
  return `<div class="inv">
   <div class="ih"><div><h4>${esc(settings.marketName||'Market')}</h4><div style="font-size:13px;color:#5b6b63">${esc(settings.address||'')}${settings.phone?'<br>Rabta: '+esc(settings.phone):''}${settings.ownerName?'<br>Malik: '+esc(settings.ownerName):''}</div></div>
   <div><div class="t">Kiraya Invoice</div><div style="font-family:var(--f-mono);font-weight:700;text-align:right">${esc(invNo(s,e))}</div><div style="font-size:13px;color:#5b6b63;text-align:right">Tareekh: ${esc(today())}</div></div></div>
   <div class="meta">
    <div><b>Karayadar</b>${esc(s.tenant)}</div><div><b>Dukaan #</b>${esc(s.shopNo)}</div>
    <div><b>Karayadar code</b><span style="font-family:var(--f-mono);font-weight:700">${esc(s.code)}</span></div><div><b>Mahina</b>${esc(monthLabel(e.month))}</div>
    ${s.phone?`<div><b>Mobile</b>${esc(s.phone)}</div>`:''}
   </div>
   <table><thead><tr><th>Tafseel</th><th class="num">Raqam</th></tr></thead><tbody>
    <tr><td>Kiraya — ${esc(monthLabel(e.month))}</td><td class="num">${rs(e.rent)}</td></tr>
    ${(+e.extra)?`<tr><td>${esc(e.extraNote||'Deegar charges')}</td><td class="num">${rs(e.extra)}</td></tr>`:''}
    <tr><td><b>Kul raqam</b></td><td class="num"><b>${rs(c.due)}</b></td></tr>
    ${(+e.paid)?`<tr><td>Jama (pehle se likha)</td><td class="num">− ${rs(e.paid)}</td></tr>`:''}
    ${ps.map(p=>`<tr><td>Jama ${esc(p.date)} · ${esc(p.method)}${p.ref?' · TID '+esc(p.ref):''}</td><td class="num">− ${rs(p.amount)}</td></tr>`).join('')}
    <tr class="tot"><td>Baqi</td><td class="num">${rs(Math.max(c.bal,0))}</td></tr>
   </tbody></table>
   ${e.note?`<p style="font-size:13px;color:#5b6b63;margin:12px 0 0">Note: ${esc(e.note)}</p>`:''}
   ${pms().length?`<div style="margin-top:14px;font-size:13px"><b style="display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6b63;margin-bottom:4px">Payment methods</b>${pms().map(p=>`<div>${esc(p.title)}: <b style="font-family:var(--f-mono)">${esc(p.number)}</b>${p.holder?' ('+esc(p.holder)+')':''}</div>`).join('')}</div>`:''}
   <div class="stamp" style="color:${col}">${st[0]==='paid'?'ADA SHUDA':st[0]==='part'?'JUZVI ADA':'BAQAYA'}</div>
  </div>`;
}
function invoiceFile(s,e,bodyHtml,ttl){
  const st=document.querySelector('style');const css=st?(st.textContent.match(/\.inv[^{]*\{[^}]*\}/g)||[]).join('\n'):'';
  return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(ttl||invNo(s,e))}</title>
<style>:root{--f-display:Georgia,serif;--f-body:system-ui,sans-serif;--f-mono:ui-monospace,monospace}body{margin:0;padding:24px;background:#fff;font-family:system-ui,sans-serif}table{border-collapse:collapse;width:100%}th,td{text-align:left}.num{text-align:right}${css}@media print{body{padding:0}}</style></head><body>${bodyHtml||invoiceBody(s,e)}<p style="font-size:12px;color:#777;margin-top:18px">Print karne ke liye Ctrl+P dabayein.</p></body></html>`;
}
function openInvoice(s,e){
  if(!s||!e)return;
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-label="Invoice"><div class="spread"><h3>Invoice</h3><button class="btn sm" id="mClose">Band karein</button></div>
   ${invoiceBody(s,e)}
   <div class="row">${downloads?'<button class="btn pri" id="mDl">Invoice download karein</button>':''}<button class="btn" id="mCp">Text copy (WhatsApp)</button></div><div id="mMsg"></div></div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();bg.onclick=ev=>{if(ev.target===bg)close()};$('#mClose').onclick=close;
  const c=entryCalc(e);
  $('#mCp').onclick=()=>copy(`*${settings.marketName||'Market'}* — Kiraya Invoice\n${invNo(s,e)}\nKarayadar: ${s.tenant}\nDukaan: ${s.shopNo} (Code ${s.code})\nMahina: ${monthLabel(e.month)}\nKiraya: ${rs(e.rent)}${(+e.extra)?`\n${e.extraNote||'Deegar'}: ${rs(e.extra)}`:''}\nKul: ${rs(c.due)}\nJama: ${rs(c.paid)}\nBaqi: ${rs(Math.max(c.bal,0))}${pms().length?'\n\nPayment:\n'+pms().map(p=>`${p.title}: ${p.number}`).join('\n'):''}`);
  const dl=$('#mDl');if(dl)dl.onclick=async()=>{try{await downloads.save({filename:invNo(s,e)+'.html',data:new Blob([invoiceFile(s,e)],{type:'text/html'})});$('#mMsg').innerHTML='<div class="msg ok">Invoice save ho gayi. Kholein aur print karein.</div>'}catch(er){if(er&&er.code!=='declined')$('#mMsg').innerHTML='<div class="msg err">Download nahi hua. "Text copy" use karein.</div>'}};
}

/* ---------- raseed (receipt) ---------- */
const ONES=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function w99(n){return n<20?ONES[n]:TENS[Math.floor(n/10)]+(n%10?'-'+ONES[n%10]:'')}
function w999(n){return(n>=100?ONES[Math.floor(n/100)]+' hundred'+(n%100?' ':''):'')+(n%100?w99(n%100):'')}
function inWords(n){n=Math.round(+n||0);if(!n)return 'Zero';const parts=[];const units=[[10000000,'crore'],[100000,'lakh'],[1000,'thousand']];
  for(const[v,l]of units){if(n>=v){parts.push(w999(Math.floor(n/v))+' '+l);n%=v}}if(n)parts.push(w999(n));const t=parts.join(' ');return t[0].toUpperCase()+t.slice(1)+' rupees only'}
function rcpNo(s,p){return 'RCP-'+s.code.replace('MK-','')+'-'+String(p.id).slice(-5).toUpperCase()}
function balAfter(e,p){const due=(+e.rent||0)+(+e.extra||0);let paid=+e.paid||0;for(const x of payList(e)){paid+=(+x.amount||0);if(x.id===p.id)break}return Math.max(due-paid,0)}
function receiptBody(s,e,p){
  const left=balAfter(e,p);
  return `<div class="inv">
   <div class="ih"><div><h4>${esc(settings.marketName||'Market')}</h4><div style="font-size:13px;color:#5b6b63">${esc(settings.address||'')}${settings.phone?'<br>Rabta: '+esc(settings.phone):''}</div></div>
   <div><div class="t">Payment Raseed</div><div style="font-family:var(--f-mono);font-weight:700;text-align:right">${esc(rcpNo(s,p))}</div><div style="font-size:13px;color:#5b6b63;text-align:right">Tareekh: ${esc(p.date)}</div></div></div>
   <p style="margin:16px 0 0;font-size:15px;line-height:1.7">Wasool kiye <b>${esc(s.tenant)}</b> se, Dukaan # <b>${esc(s.shopNo)}</b> (code <span style="font-family:var(--f-mono);font-weight:700">${esc(s.code)}</span>), <b>${esc(monthLabel(e.month))}</b> ke kiraye ki mad mein.</p>
   <div style="margin-top:14px;border:2px solid #0D6B4E;border-radius:8px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
     <div><b style="display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#5b6b63">Raqam</b><span style="font-family:var(--f-display);font-size:28px;font-weight:700;color:#0D6B4E">${rs(p.amount)}</span></div>
     <div style="font-size:13px;color:#5b6b63;max-width:300px">${esc(inWords(p.amount))}</div></div>
   <div class="meta">
    <div><b>Tareeqa</b>${esc(p.method||'—')}</div><div><b>Transaction ID</b>${esc(p.ref||'—')}</div>
    <div><b>Mahine ka kul bill</b>${rs((+e.rent||0)+(+e.extra||0))}</div><div><b>Is payment ke baad baqi</b>${rs(left)}</div>
    <div><b>Invoice #</b>${esc(invNo(s,e))}</div>
   </div>
   <div style="display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-top:22px">
     <div class="stamp" style="color:${left?'#8A5A00':'#1F7A3F'};margin-top:0">${left?'JUZVI WASOOL':'MUKAMMAL WASOOL'}</div>
     <div style="text-align:center;font-size:12.5px;color:#5b6b63"><div style="border-top:1px solid #16211c;width:170px;padding-top:4px">${esc(settings.ownerName||'Malik')} — dastakhat</div></div></div>
  </div>`;
}
function openModal(title,body,file,fileTitle,copyText){
  const bg=document.createElement('div');bg.className='modal-bg';
  bg.innerHTML=`<div class="modal" role="dialog" aria-label="${esc(title)}"><div class="spread"><h3>${esc(title)}</h3><button class="btn sm" data-x>Band karein</button></div>
   ${body}<div class="row">${downloads?'<button class="btn pri" data-dl>Download karein</button>':''}<button class="btn" data-cp>Text copy (WhatsApp)</button></div><div data-msg></div></div>`;
  document.body.appendChild(bg);const q=x=>bg.querySelector(x);
  const close=()=>bg.remove();bg.onclick=ev=>{if(ev.target===bg)close()};q('[data-x]').onclick=close;
  q('[data-cp]').onclick=()=>copy(copyText);
  const dl=q('[data-dl]');if(dl)dl.onclick=async()=>{try{await downloads.save({filename:file,data:new Blob([invoiceFile(null,null,body,fileTitle)],{type:'text/html'})});q('[data-msg]').innerHTML='<div class="msg ok">Save ho gayi. Kholein aur print karein.</div>'}catch(er){if(er&&er.code!=='declined')q('[data-msg]').innerHTML='<div class="msg err">Download nahi hua. "Text copy" use karein.</div>'}};
}
function openReceipt(s,e,p){if(!s||!e||!p)return;const no=rcpNo(s,p);
  openModal('Payment Raseed',receiptBody(s,e,p),no+'.html',no,
  `*${settings.marketName||'Market'}* — Payment Raseed\n${no}\nTareekh: ${p.date}\nKarayadar: ${s.tenant}\nDukaan: ${s.shopNo} (Code ${s.code})\nMahina: ${monthLabel(e.month)}\nWasool raqam: ${rs(p.amount)}\n(${inWords(p.amount)})\nTareeqa: ${p.method}${p.ref?'\nTID: '+p.ref:''}\nBaqi: ${rs(balAfter(e,p))}\nShukriya!`)}

/* ---------- boot ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;if(b.dataset.tab!=='shops')view.shop=null;render()});
(async()=>{
  const C=window.claude;if(!C||!C.use){render();return}
  const [d,u,dl]=await Promise.all([C.use('db'),C.use('user'),C.use('downloads')]);
  db=d;downloads=dl;
  try{isAdmin=u?await u.canEdit():false}catch(_){isAdmin=false}
  if(!db){render();return}
  $('#tabs').hidden=!isAdmin;
  db.doc('meta/settings').onSnapshot(sn=>{if(sn.exists){settings={...settings,...sn.data()};applySettings();const a=document.activeElement;if(view.tab!=='settings'&&!(a&&a.matches&&a.matches('input,textarea,select')))render()}},()=>{});
  applySettings();
  if(isAdmin){
    db.collection('shops').onSnapshot(sn=>{shops=sn.docs.map(x=>x.data());loaded=true;const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea,select'))return;if(view.tab==='settings'||view.tab==='add'||view.tab==='tenant')return;render()},()=>{loaded=true;render()});
  }
  view.tab=isAdmin?'shops':'tenant';
  if(/^MK-/i.test(location.hash.slice(1)))view.tab='tenant';
  render();
})();
})();

</script>
